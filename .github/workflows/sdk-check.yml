name: SDK checks
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
permissions:
  contents: read
# Our runners only, never GitHub-hosted (owner order 2026-11-04): Linux = ephemeral k3s scale set ci-sdk-web,
# macOS = the Mac runner bm-mac-busymate-ai-sdk-web. There is no Windows runner; the SDK is plain JS with no
# OS-specific code, so the former windows-latest leg is dropped (Linux and macOS still build, lint, test, pack).
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: '"ci-sdk-web"' }
          - { os: macos, runner: '["self-hosted","macOS","bm-mac"]' }
    runs-on: ${{ fromJSON(matrix.runner) }}
    # Mac jobs: the timeout includes the wait for the shared Mac's one-job lock.
    timeout-minutes: ${{ contains(toJSON(matrix), 'bm-mac') && 150 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify pinned contract and release metadata
        run: python3 scripts/verify-release.py
      - name: SDK version from package.json
        shell: bash
        run: echo "SDK_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
      - name: Build SDK (ESM + CJS + types + script-tag IIFE)
        run: npm run build
      - name: Check the built package (zero deps, SSR import, same API in every build)
        run: npm run check:dist
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (pinned wire against a stand-in frame)
        run: npm test
      - name: Pack
        run: npm pack
      - name: Build the React example against the packed SDK
        working-directory: example-app/react
        shell: bash
        run: |
          npm ci
          npm install --no-save ../../busymate-ai-web-${{ env.SDK_VERSION }}.tgz
          node -e "import('@busymate/ai-web').then((s) => { if (s.SDK_VERSION !== process.env.SDK_VERSION) process.exit(1); console.log('example resolves', s.SDK_VERSION) })"
          npx vite build
      - name: Syntax-check the plain example
        run: node --check example-app/plain/app.js && node --check example-app/server.mjs
      - if: matrix.os == 'linux'
        name: Stage release files
        run: |
          mkdir release
          cp busymate-ai-web-${{ env.SDK_VERSION }}.tgz release/
          cp dist/busymate-ai-web.iife.js release/busymate-ai-web-${{ env.SDK_VERSION }}.iife.js
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: busymate-ai-web-${{ env.SDK_VERSION }}
          path: release/

  sdk-check:
    if: always()
    needs: [build]
    runs-on: ci-sdk-web
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No GitHub-hosted runners (runs-on lint)
        run: python3 .github/runs-on-lint.py
      - name: All SDK checks passed
        run: test "${{ needs.build.result }}" = success
