name: Release to npm
# Publishes @busymate/ai-web to npm with provenance from a version tag.
# Run it from Actions (input: tag, e.g. 0.1.0) or push a new tag. The tag must equal package.json version.
# Auth: npm trusted publishing (GitHub OIDC) only, configured on npmjs.com. No npm token.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (equal to the package.json version)
        required: true
  push:
    tags: ["[0-9]*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        run: test "$TAG" = "$(node -p "require('./package.json').version")"
      - run: python3 scripts/verify-release.py
      - run: npm ci
      - run: npm run build
      - run: npm run check:dist
      - run: npm test
      - name: Publish to npm with provenance
        run: |
          # Trusted publishing: npm exchanges the job's OIDC token (id-token: write); setup-node's placeholder token must not be used.
          unset NODE_AUTH_TOKEN
          npm install -g npm@^11.5.1 --no-audit --no-fund
          V=$(node -p "require('./package.json').version")
          if npm view "@busymate/ai-web@$V" version >/dev/null 2>&1; then echo "already on npm"; else npm publish --provenance --access public; fi
